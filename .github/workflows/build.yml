name: Build Nexauren Story
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8")); for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log(JSON.stringify({ name, severity: item.severity, fixAvailable: item.fixAvailable }));'
      - run: npm run check
      - run: npm run check:catalog
      - run: npm run build
      - name: Verify generated SEO files and all tool routes
        run: node scripts/verify-output.mjs
